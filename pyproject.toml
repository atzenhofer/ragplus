[project]
name = "ragplus"
version = "0.1.0"
description = "Retrieval, recommendation and RAG over a document corpus, with the query context under user control"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "numpy>=2.0",
    "rank-bm25>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# EMBED_BACKEND=local: embeddings computed on this machine with sentence-transformers
local-embed = ["sentence-transformers>=3.0", "torch>=2.6"]

# Run modules directly, e.g. `.venv/bin/python -m ragplus.app`; the project is not packaged.
[tool.uv]
package = false
